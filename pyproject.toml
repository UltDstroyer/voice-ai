[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-voice"
version = "0.1.0"
description = "Opt-in local voice conversation extension for Context Switcher"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
audio = ["numpy>=1.26", "sounddevice>=0.5"]
vad = ["numpy>=1.26", "sounddevice>=0.5", "silero-vad>=6.0"]
chatterbox = ["chatterbox-tts"]
test = []

[project.scripts]
ctx-ext-voice = "voice_ai.cli:main"
ctx-voice = "voice_ai.cli:main"

[tool.setuptools.packages.find]
include = ["voice_ai*"]

[tool.setuptools.package-data]
voice_ai = ["extension.json"]
