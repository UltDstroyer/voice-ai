name: Voice extension checks
on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q voice_ai tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  nix-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate flake
        run: nix flake show --show-trace
      - name: Build extension
        run: nix build .#packages.x86_64-linux.default --show-trace
      - name: Evaluate NixOS module
        run: |
          nix eval --raw --impure --expr '
            let
              f = builtins.getFlake (toString ./.);
              system = f.inputs.nixpkgs.lib.nixosSystem {
                system = "x86_64-linux";
                modules = [
                  f.nixosModules.default
                  ({ ... }: {
                    system.stateVersion = "26.05";
                    programs.ctxVoice.enable = true;
                  })
                ];
              };
            in builtins.head (map toString system.config.environment.systemPackages)
          '
